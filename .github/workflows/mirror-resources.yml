name: Verify and mirror XNB reader resources
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    if: github.repository == 'zsan06261-hue/xnbreader-resources'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Transfer SHA-256 pinned assets into existing draft releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/mirror_assets.py
